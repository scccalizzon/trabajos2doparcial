<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = Number (prompt("Introduce el primer numero:"));
        let num2 = Number (prompt("Introduce el segudo numero:"));
        let opcion = parseInt
        (prompt(
            "Elige una opcion:"+
            "1.Suma"+
            "2.Resta"+
            "3.Multiplicacion"
        ));
        switch (opcion){
            case 1: 
            alert("la suma es:" + (num1+num2));
            break;
            case 2:
            alert ("La resta es:" + (num1 - num2));
            break;
            case 3: 
            alert("La multiplicacion es:" + (num1*num2));
            break;
            default:
            alert("opcion no validad");
        }
    </script>
</body>
</html>
