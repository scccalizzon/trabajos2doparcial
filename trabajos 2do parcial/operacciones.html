<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operaciones</title>
</head>
<body>
    <h1>OPERACIONES BASICAS</h1>
    <script>
        let n1 = Number (prompt("escribe el primer numero"));
        let n2 = Number (prompt("escribe el segundo numero"));
        suma = n1 + n2;
        resta = n1 - n2;
        multiplicacion = n1 * n2;
        division = n1 / n2;

        document.write ("la suma es:" + suma + "<br>");
    
        document.write ("la resta es:"+ resta + "<br>");
        
        document.write ("la multiplicacion es:"+ multiplicacion + "<br>");
        
        document.write ("la division es:"+ division + "<br>");

    </script>
</body>
</html>
