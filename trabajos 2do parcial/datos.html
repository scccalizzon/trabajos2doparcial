<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATOS</title>
</head>
<body>
    <h1>DATOS</h1>
    <script>
        let nombre = prompt ("Escribe tu nombre");
        let especialidad = prompt ("Escribe tu especialidad");
        let Edad = Number (prompt ("Escribe tu Edad"));
        let domicilio = prompt ("Escribe tu domicilio"); 

        document.write ("Nombre:"+ nombre + "<br>");
        document.write ("Especialidad:"+ especialidad + "<br>");
        document.write ("Edad:"+ Edad + "<br>");
        document.write ("Domicilio:"+ domicilio + "<br>");
    </script>
</body>
</html>
